name: iOS App Store Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "App Store build number"
        required: true
        default: "13"
      upload_to_app_store:
        description: "Upload archive to App Store Connect"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      capture_ipad:
        description: "Capture iPad screen as well as iPhone"
        required: true
        default: true
        type: boolean

jobs:
  build-ios:
    runs-on: macos-26

    env:
      APP_SCHEME: MarketplaceLiteracyApp
      APP_PROJECT: ios/MarketplaceLiteracyApp.xcodeproj
      ARCHIVE_PATH: /tmp/MarketplaceLiteracyApp.xcarchive
      EXPORT_PATH: /tmp/ios-export

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_26_APP="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          if [ -n "$XCODE_26_APP" ]; then
            sudo xcode-select -s "$XCODE_26_APP"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icons
        run: bash ios/scripts/generate-app-icons.sh

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned simulator smoke check
        run: |
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MLPDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile navigation tests before simulator startup
        if: ${{ inputs.upload_to_app_store != 'true' }}
        run: |
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MLPDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Launch simulators and capture Library screens
        if: ${{ inputs.upload_to_app_store != 'true' }}
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"] and d.get("isAvailable", True)]; chosen=next((d for d in devices if d["name"] == "iPhone 17 Pro Max"), devices[0] if devices else None); print(chosen["udid"] if chosen else "")')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="$RUNNER_TEMP/MLPDerivedData/Build/Products/Debug-iphonesimulator/Marketplace Literacy App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" org.marketplaceliteracy.app
          sleep 20
          mkdir -p "$RUNNER_TEMP/ios-screenshots"
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ios-screenshots/iphone-library.png"
          xcrun simctl ui "$DEVICE_ID" appearance dark
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ios-screenshots/iphone-library-dark.png"
          xcrun simctl ui "$DEVICE_ID" appearance light
          if [ "${{ inputs.capture_ipad }}" = "true" ]; then
          xcrun simctl shutdown "$DEVICE_ID"
          IPAD_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPad" in d["name"] and d.get("isAvailable", True)]; chosen=next((d for d in devices if "13-inch" in d["name"]), devices[0] if devices else None); print(chosen["udid"] if chosen else "")')"
          test -n "$IPAD_ID"
          xcrun simctl boot "$IPAD_ID"
          xcrun simctl bootstatus "$IPAD_ID" -b
          xcrun simctl install "$IPAD_ID" "$APP_PATH"
          xcrun simctl launch "$IPAD_ID" org.marketplaceliteracy.app
          sleep 20
          xcrun simctl io "$IPAD_ID" screenshot "$RUNNER_TEMP/ios-screenshots/ipad-library.png"
          fi

      - name: Test library navigation and capture resource player
        if: ${{ inputs.upload_to_app_store != 'true' }}
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"] and d.get("isAvailable", True)]; chosen=next((d for d in devices if d["name"] == "iPhone 17 Pro Max"), devices[0] if devices else None); print(chosen["udid"] if chosen else "")')"
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/MLPDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/LibraryFlow.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Export navigation test screenshots
        if: ${{ always() && inputs.upload_to_app_store != 'true' }}
        run: |
          if [ -d "$RUNNER_TEMP/LibraryFlow.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/LibraryFlow.xcresult" --output-path "$RUNNER_TEMP/ios-screenshots/test-flow"
          fi

      - name: Upload navigation test results
        if: ${{ always() && inputs.upload_to_app_store != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MarketplaceLiteracyApp-navigation-tests
          path: ${{ runner.temp }}/LibraryFlow.xcresult

      - name: Upload simulator screenshots
        if: ${{ always() && inputs.upload_to_app_store != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MarketplaceLiteracyApp-simulator-screenshots
          path: ${{ runner.temp }}/ios-screenshots

      - name: Import signing certificate
        if: ${{ inputs.upload_to_app_store == 'true' }}
        env:
          APPLE_CERTIFICATE_CER_BASE64: ${{ secrets.APPLE_CERTIFICATE_CER_BASE64 }}
          APPLE_PRIVATE_KEY_PEM_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_PEM_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          printf '%s' "$APPLE_CERTIFICATE_CER_BASE64" | base64 -D > distribution.cer
          printf '%s' "$APPLE_PRIVATE_KEY_PEM_BASE64" | base64 -D > signing-key.pem
          security import distribution.cer -k build.keychain -T /usr/bin/codesign
          security import signing-key.pem -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        if: ${{ inputs.upload_to_app_store == 'true' }}
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$HOME/Library/MobileDevice/Provisioning Profiles/MarketplaceLiteracyApp.mobileprovision"

      - name: Archive for App Store
        if: ${{ inputs.upload_to_app_store == 'true' }}
        env:
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.APPLE_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_SPECIFIER" \
            archive

      - name: Create export options
        if: ${{ inputs.upload_to_app_store == 'true' }}
        env:
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.APPLE_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_DEVELOPMENT_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.marketplaceliteracy.app</key>
              <string>${APPLE_PROVISIONING_PROFILE_SPECIFIER}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        if: ${{ inputs.upload_to_app_store == 'true' }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        if: ${{ inputs.upload_to_app_store == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MarketplaceLiteracyApp-iOS
          path: ${{ env.EXPORT_PATH }}/*.ipa

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_app_store == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$EXPORT_PATH"/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
