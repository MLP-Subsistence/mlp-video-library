name: MarketplaceLiteracyApp
options:
  bundleIdPrefix: org.marketplaceliteracy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "14"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  MarketplaceLiteracyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MarketplaceLiteracyApp
        excludes:
          - LibraryTranslations.json
    resources:
      - path: MarketplaceLiteracyApp/Assets.xcassets
      - path: MarketplaceLiteracyApp/LibraryTranslations.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.marketplaceliteracy.app
        PRODUCT_NAME: Marketplace Literacy App
        INFOPLIST_FILE: MarketplaceLiteracyApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - MarketplaceLiteracyAppUITests
  MarketplaceLiteracyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MarketplaceLiteracyAppUITests
    dependencies:
      - target: MarketplaceLiteracyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.marketplaceliteracy.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MarketplaceLiteracyApp
